name: screenshots
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Latest release (x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ${{ github.repository }} --pattern 'YtGrab-Win32-x64.zip' -O app.zip
          Expand-Archive app.zip -DestinationPath app
      - name: Screenshots
        run: ./scripts/screenshots.ps1 -App app -Out shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
