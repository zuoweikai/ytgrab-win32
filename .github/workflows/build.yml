name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain (x64, MinGW-w64 GCC)
        if: matrix.arch == 'x64'
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix mingw-w64-tools

      - name: Toolchain (ARM64, llvm-mingw)
        if: matrix.arch == 'arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R mstorsjo/llvm-mingw --pattern 'llvm-mingw-*-ucrt-ubuntu-22.04-x86_64.tar.xz' -O llvm-mingw.tar.xz
          mkdir -p "$HOME/llvm-mingw" && tar -xf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: WebView2 SDK (header + WebView2Loader.dll)
        run: bash scripts/fetch-webview2.sh ${{ matrix.arch }} dist/YtGrab-win-${{ matrix.arch }}/tools

      - name: Build
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CXX=aarch64-w64-mingw32-clang++ WINDRES=aarch64-w64-mingw32-windres
          else
            export CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres
          fi
          OUT="$PWD/dist/YtGrab-win-${{ matrix.arch }}/YtGrab.exe" sh src/build.sh

      - name: Bundle yt-dlp and ffmpeg
        run: bash scripts/fetch-tools.sh ${{ matrix.arch }} dist/YtGrab-win-${{ matrix.arch }}/tools

      - name: Zip
        run: |
          cd dist/YtGrab-win-${{ matrix.arch }} && zip -9 -r "../YtGrab-Win32-${{ matrix.arch }}.zip" .
          ls -la ..

      - uses: actions/upload-artifact@v4
        with:
          name: YtGrab-Win32-${{ matrix.arch }}
          path: dist/YtGrab-Win32-${{ matrix.arch }}.zip

  # After both builds pass: if VERSION has no tag yet, publish Release v<VERSION> with both zips.
  auto-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read version
        id: ver
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          pattern: YtGrab-Win32-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: YtGrab Win32 ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: dist/*.zip
